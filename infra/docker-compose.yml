services:
  # ==========================================
  # Core Infrastructure Profile (core)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: notify-postgres
    profiles: ["core", "app"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notify}
      POSTGRES_USER: ${POSTGRES_USER:-notify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placeholder_db_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notify_user} -d ${POSTGRES_DB:-notify}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: notify-redis
    profiles: ["core", "app"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: notify-kafka
    profiles: ["core", "app"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # Application Services Profile (app)
  # ==========================================
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: notify-backend
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      NOTIFY_ROLE: all
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-notify}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-notify_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-placeholder_db_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # / the email worker stays disabled unless explicitly enabled (). The fake provider is the default.
      # NOTIFY_RESEND_API_KEY is deliberately NOT interpolated here: scripts/gate.ps1 prints `docker compose config`,
      # which would expose a resolved key. Supply it at run time (for example `docker compose run -e NOTIFY_RESEND_API_KEY ...`).
      NOTIFY_WORKER_EMAIL_ENABLED: ${NOTIFY_WORKER_EMAIL_ENABLED:-false}
      NOTIFY_EMAIL_PROVIDER: ${NOTIFY_EMAIL_PROVIDER:-fake}
      NOTIFY_MAIL_FROM: ${NOTIFY_MAIL_FROM:-notifications@example.com}
      # / the webhook worker stays disabled unless explicitly enabled (extended).
      #
      # NOTIFY_WEBHOOK_SECRET_KEY is deliberately absent from this file. A service receives it only if the Compose
      # file declares it, and `docker compose config` — which scripts/gate.ps1 prints — resolves and prints anything
      # declared here; that holds for the bare `- VAR` form (value taken from the host environment) and for
      # `env_file:` (contents inlined). Both were verified with a disposable test value. Supported ways to supply it:
      #   `up`:  copy infra/docker-compose.secret.yml.example to infra/docker-compose.secret.yml (git-ignored) and run
      #          docker compose -f infra/docker-compose.yml -f infra/docker-compose.secret.yml ... up
      #   one-off: docker compose run -e NOTIFY_WEBHOOK_SECRET_KEY backend ...  (forwards it from the host environment)
      # Never pass the override file to a command whose output is shared. Without the key the webhook worker refuses
      # to start and the configuration API answers 503 FEATURE_NOT_YET_AVAILABLE.
      NOTIFY_WORKER_WEBHOOK_ENABLED: ${NOTIFY_WORKER_WEBHOOK_ENABLED:-false}
      # / spans go to the obs-profile collector. The OTLP exporter fails open, so running the
      # app profile without the obs profile simply drops traces instead of affecting delivery.
      NOTIFY_OTLP_TRACES_ENDPOINT: ${NOTIFY_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: notify-frontend
    profiles: ["app"]
    depends_on:
      - backend
    ports:
      - "5173:8080"
    restart: unless-stopped

  # / infrastructure observability. Kept in its own "obs" profile so core/app validation and
  # start-up never require it; bring it up with --profile obs alongside app.
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: notify-prometheus
    profiles: ["obs"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: notify-grafana
    profiles: ["obs"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Default home dashboard directly opens the platform overview
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/notify-overview.json"
      # Seamless access from Notify Admin Console (single pane of glass)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  # / traces and logs. Grafana provisions Loki and Tempo datasources alongside Prometheus, with a
  # derived field linking a log line's trace.id to its Tempo trace.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: notify-otel-collector
    profiles: ["obs"]
    command: ["--config=/etc/otel-collector/config.yml"]
    depends_on:
      - tempo
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: notify-tempo
    profiles: ["obs"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: notify-loki
    profiles: ["obs"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: notify-alloy
    profiles: ["obs"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # Read-only access to container stdout, which is where the backend's structured ECS JSON lands.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  alloy_data:
