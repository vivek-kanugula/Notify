# / + provisioned datasources for the obs profile.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: notify-prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    uid: notify-loki
    url: http://loki:3100
    editable: false
    jsonData:
      # Log-to-trace navigation (TRD section 14): the backend logs structured ECS JSON, so a log line
      # carries "trace.id":"<hex>". Clicking the derived field opens that trace in Tempo.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace\.id":"(\w+)"'
          url: '${__value.raw}'
          datasourceUid: notify-tempo

  - name: Tempo
    type: tempo
    access: proxy
    uid: notify-tempo
    url: http://tempo:3200
    editable: false
    jsonData:
      # Trace-to-logs navigation back the other way, keyed on the same tenant/service labels.
      tracesToLogsV2:
        datasourceUid: notify-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
      nodeGraph:
        enabled: true
