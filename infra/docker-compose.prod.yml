# ==========================================================================
# Notify — Production Docker Compose
# ==========================================================================
# Usage:
#   1. Copy infra/.env.production.example to infra/.env and fill in real values.
#   2. docker compose -f infra/docker-compose.prod.yml up -d
#   3. With observability: docker compose -f infra/docker-compose.prod.yml --profile obs up -d
#
# Architecture:
#   Internet → Caddy (TLS :443) → frontend (Nginx :8080) → backend (:8080)
#                                                       → backend /api/, /auth/, /sse/, /demo/
#   Internal: PostgreSQL :5432 | Redis :6379 | Kafka :29092 (no external listeners)
# ==========================================================================

services:
  # ========================================
  # Reverse Proxy / TLS Termination
  # ========================================
  caddy:
    image: caddy:2-alpine
    container_name: notify-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    command: >
      caddy reverse-proxy
        --from ${DOMAIN}
        --to frontend:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --header=\"Host: $$DOMAIN\" http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      frontend:
        condition: service_started

  # ========================================
  # Core Infrastructure
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: notify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notify}
      POSTGRES_USER: ${POSTGRES_USER:-notify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notify_user} -d ${POSTGRES_DB:-notify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No ports exposed — internal Docker network only

  redis:
    image: redis:7-alpine
    container_name: notify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # No ports exposed — internal Docker network only

  kafka:
    image: apache/kafka:3.8.0
    container_name: notify-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Production: internal listener only — no external PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # No ports exposed — internal Docker network only

  # ========================================
  # Application Services
  # ========================================
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: notify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NOTIFY_ROLE: all
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-notify}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-notify_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Public and Frontend URLs (Same-Origin via Caddy TLS termination)
      NOTIFY_PUBLIC_URL: https://${DOMAIN}
      NOTIFY_FRONTEND_URL: https://${DOMAIN}
      # Security
      NOTIFY_JWT_SECRET: ${NOTIFY_JWT_SECRET:?Set NOTIFY_JWT_SECRET in .env}
      NOTIFY_ADMIN_EMAIL: ${NOTIFY_ADMIN_EMAIL:?Set NOTIFY_ADMIN_EMAIL in .env}
      NOTIFY_ADMIN_PASSWORD: ${NOTIFY_ADMIN_PASSWORD:?Set NOTIFY_ADMIN_PASSWORD in .env}
      # Email
      NOTIFY_EMAIL_PROVIDER: ${NOTIFY_EMAIL_PROVIDER:-resend}
      NOTIFY_RESEND_API_KEY: ${NOTIFY_RESEND_API_KEY:-}
      NOTIFY_MAIL_FROM: ${NOTIFY_MAIL_FROM:-notifications@example.com}
      # Webhook
      NOTIFY_WEBHOOK_SECRET_KEY: ${NOTIFY_WEBHOOK_SECRET_KEY:-}
      # Workers (all disabled by default — )
      NOTIFY_WORKER_EMAIL_ENABLED: ${NOTIFY_WORKER_EMAIL_ENABLED:-false}
      NOTIFY_WORKER_WEBHOOK_ENABLED: ${NOTIFY_WORKER_WEBHOOK_ENABLED:-false}
      NOTIFY_WORKER_INAPP_ENABLED: ${NOTIFY_WORKER_INAPP_ENABLED:-false}
      # Infrastructure workers
      NOTIFY_OUTBOX_RELAY_ENABLED: ${NOTIFY_OUTBOX_RELAY_ENABLED:-true}
      NOTIFY_RECONCILER_ENABLED: ${NOTIFY_RECONCILER_ENABLED:-true}
      NOTIFY_RECOVERY_ENABLED: ${NOTIFY_RECOVERY_ENABLED:-false}
      NOTIFY_RESILIENCE_ENABLED: ${NOTIFY_RESILIENCE_ENABLED:-false}
      # DLQ consumers
      NOTIFY_DLQ_CONSUMER_ENABLED: ${NOTIFY_DLQ_CONSUMER_ENABLED:-false}
      NOTIFY_DLQ_DLT_CONSUMER_ENABLED: ${NOTIFY_DLQ_DLT_CONSUMER_ENABLED:-false}
      # Observability
      NOTIFY_TRACE_SAMPLING: ${NOTIFY_TRACE_SAMPLING:-0.1}
      NOTIFY_OTLP_TRACES_ENDPOINT: ${NOTIFY_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    # No ports exposed — accessed via frontend Nginx reverse proxy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: notify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No ports exposed — accessed via Caddy reverse proxy

  # ========================================
  # Observability Stack (opt-in: --profile obs)
  # ========================================
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: notify-prometheus
    profiles: ["obs"]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # No ports exposed — accessed via Grafana

  grafana:
    image: grafana/grafana:11.2.0
    container_name: notify-grafana
    profiles: ["obs"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Default home dashboard directly opens the platform overview
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/notify-overview.json"
      # Seamless access from Notify Admin Console (single pane of glass)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Bound to host loopback interface only — accessible securely via SSH tunnel (ssh -L 3000:localhost:3000)
    ports:
      - "127.0.0.1:3000:3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: notify-otel-collector
    profiles: ["obs"]
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/config.yml"]
    depends_on:
      - tempo
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otel-collector/config.yml:ro
    # No ports exposed — internal only

  tempo:
    image: grafana/tempo:2.6.1
    container_name: notify-tempo
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    # No ports exposed — internal only

  loki:
    image: grafana/loki:3.2.1
    container_name: notify-loki
    profiles: ["obs"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    # No ports exposed — internal only

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: notify-alloy
    profiles: ["obs"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No ports exposed — internal only

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
  alloy_data:

