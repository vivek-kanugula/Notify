# CI Verification Gate
#
# Runs backend tests with Redis and Testcontainers, frontend tests,
# frontend production build, and Docker Compose configuration validation.
name: gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Testcontainers drives PostgreSQL/Kafka itself; Redis runs as a service container on port 6379.
      - name: Backend tests
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode test

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Docker Compose configuration check
        run: docker compose -f infra/docker-compose.yml --profile core --profile app --profile obs config > /dev/null

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
