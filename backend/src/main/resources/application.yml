spring:
  application:
    name: notify-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notify}
    username: ${SPRING_DATASOURCE_USERNAME:notify_user}
    password: ${SPRING_DATASOURCE_PASSWORD:placeholder_db_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # / W3C distributed tracing. Default sampling is the production rate (10%); application-local.yml
  # raises it to 100%. The OTLP exporter is lazy and fails open, so telemetry export never blocks delivery.
  tracing:
    sampling:
      probability: ${NOTIFY_TRACE_SAMPLING:0.1}
  otlp:
    tracing:
      endpoint: ${NOTIFY_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

notify:
  role: all
  public-url: ${NOTIFY_PUBLIC_URL:http://localhost:8080}
  frontend-url: ${NOTIFY_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${NOTIFY_JWT_SECRET:placeholder_hs256_secret_key_minimum_32_characters_long}
  auth:
    require-gmail: ${NOTIFY_AUTH_REQUIRE_GMAIL:true}
  admin:
    default-email: ${NOTIFY_ADMIN_EMAIL:admin@notify.local}
    default-password: ${NOTIFY_ADMIN_PASSWORD:placeholder_admin_password_min_10_chars}
  demo:
    public: false
  outbox:
    relay-enabled: ${NOTIFY_OUTBOX_RELAY_ENABLED:true}
    relay-interval-ms: 500
    batch-size: 10
    per-message-timeout-ms: 1000
  reconciler:
    enabled: ${NOTIFY_RECONCILER_ENABLED:true}
    interval-ms: 60000
  email:
    # fake (default, deterministic, never contacts a network) | resend. The fake provider is rejected under the prod profile.
    provider: ${NOTIFY_EMAIL_PROVIDER:fake}
  resend:
    # Secret: supply only via the environment. Never commit a value.
    api-key: ${NOTIFY_RESEND_API_KEY:}
    base-url: https://api.resend.com
    connect-timeout: 2s     # confirmed decision 6
    read-timeout: 8s        # Spring request-factory read timeout (response headers); body read has a total budget
    max-response-bytes: 65536
  webhook:
    # / . Secret: supply only via the environment, base64 of 32 bytes. Never commit a value.
    # Without it the webhook configuration API answers 503 FEATURE_NOT_YET_AVAILABLE and the worker refuses to start.
    secret-key: ${NOTIFY_WEBHOOK_SECRET_KEY:}
    connect-timeout: 2s       # , a ceiling inside the total budget, never added to it
    total-timeout: 5s         # , one wall-clock budget per attempt: DNS, pool, connect, TLS, headers, body
    dns-timeout: 2s           # ceiling for one name resolution, inside the total budget (F7)
    max-response-bytes: 8192  # hard read cap
    # UTF-8 bytes of the STORED snippet, truncation marker included (). 4096 matches the width of
    # delivery_attempts.response_snippet; 4096 UTF-8 bytes are never more than 4096 characters, so the value fits.
    stored-snippet-bytes: 4096
    user-agent: Notify-Webhook/1
    # the only path that allows plain http or a loopback destination, for is_demo endpoints outside prod.
    demo-allowlist: ${NOTIFY_WEBHOOK_DEMO_ALLOWLIST:}
  retry:
    base-delay: 30s
    max-delay: 15m
    jitter: 0.2
  resilience:
    max-deferrals: 50
    # / (): provider circuit breakers, channel bulkheads and the Resend outbound rate limit.
    # Disabled by default, like every worker in this project: adding the dependency and this block cannot change
    # the behaviour of an existing deployment until this is set. The guard short-circuits when it is off, so the
    # beans exist either way.
    enabled: ${NOTIFY_RESILIENCE_ENABLED:false}
    # upper bound on a receiver-supplied Retry-After used as a next_retry_at FLOOR. A larger value is
    # clamped, never rejected, so a receiver cannot park work; it can never shorten the exponential backoff and
    # never buys an extra attempt.
    max-retry-after: 5m
    breaker:
      failure-rate-threshold-percent: 50
      sliding-window-size: 20
      minimum-calls: 10              # at most the window size, or the breaker could never decide
      wait-in-open-state: 30s
      half-open-permitted-calls: 3
    bulkhead:
      # Concurrent provider calls per channel. A full bulkhead refuses immediately and the notification is
      # deferred durably (no attempt consumed); it never parks a worker thread. IN_APP is absent: it calls no
      # provider. These are deliberately NOT coupled to listener concurrency.
      email: 3
      webhook: 3
    rate-limit:
      # PER INSTANCE - it holds no shared state, so it bounds what one instance sends, not what a cluster sends.
      # 10/s is a conservative placeholder and is NOT verified against Resend's published or account limits; it
      # must not be described as provider-safe until it is. 0 disables the limiter.
      resend-permits: 10
      resend-period: 1s
    host-registry:
      # Webhook breakers are keyed by host, and hosts are tenant-controlled, so the registry is bounded and
      # evicts least-recently-used entries.
      max-hosts: 256
      # Must exceed breaker.wait-in-open-state (asserted at startup): an evicted breaker starts closed, so
      # evicting an idle host whose breaker could still be open would readmit traffic to a failing host.
      idle-expiry: 30m
  dlq:
    # / (): dead-letter materialization, quarantine and the admin DLQ API.
    # Both consumers are DISABLED by default in every profile, exactly like every delivery worker ().
    # Enabling them in a shared environment is a separately authorized action, and so is any offset
    # initialization, seek, reset or backlog drainage.
    consumer:
      # Consumes notify.dlq.v1 - the authoritative event, written in the same transaction as the FAILED status.
      # It is the only path that may materialize a business dead-letter entry ().
      enabled: ${NOTIFY_DLQ_CONSUMER_ENABLED:false}
      group-id: notify-dlq-consumer
      # The contracted topic. Overridable only so an acceptance run can own a topic of its own, exactly as every
      # delivery worker's topic is; a deployment leaves it alone.
      topic: notify.dlq.v1
      max-poll-records: 10
      concurrency: 1
      retry-interval: 500ms
      retry-attempts: 3
      pause-initial: 5s
      pause-max: 1m
    dlt-consumer:
      # Consumes notify.dispatch.*.v1.DLT. It writes quarantine rows ONLY: no lifecycle transition, no business
      # entry, no outbox event (). A verified association proves association, never causation.
      enabled: ${NOTIFY_DLQ_DLT_CONSUMER_ENABLED:false}
      group-id: notify-dlt-consumer
      max-poll-records: 10
      concurrency: 1
      retry-interval: 500ms
      retry-attempts: 3
      pause-initial: 5s
      pause-max: 1m
    # Path to a reviewed offset-initialization input (exact next-to-consume offsets per topic and partition, tied
    # to an environment and a group). UNSET means no initializer runs at all, and a missing committed position
    # then stops the listener with actionable evidence rather than seeking ().
    # auto.offset.reset is fixed at none in code and is deliberately not a property.
    offset-init-file: ${NOTIFY_DLQ_OFFSET_INIT_FILE:}
    api:
      default-limit: 50
      max-limit: 200
      # Attempts and history embedded in a detail response; the rest is reachable through the cursored
      # sub-resources, so a notification with hundreds of attempts cannot produce an unbounded response.
      detail-embedded-limit: 20
  recovery:
    # / (, decision ): recovery of notifications left PROCESSING by a worker that died.
    # Disabled by default, like every worker here; the acceptance run enables it explicitly. The scheduler bean
    # does not even exist unless this is true, and the scan re-checks it.
    enabled: ${NOTIFY_RECOVERY_ENABLED:false}
    # How long a claim may sit in PROCESSING before it is treated as abandoned. Validated at a one-minute floor,
    # which is several times the longest bounded single attempt (EMAIL connect 2s + read 8s, webhook 5s), so a
    # merely slow worker is never reaped and its send never duplicated.
    stuck-after: 10m
    # Validated at a 10s floor. Worst-case recovery latency is stuck-after + scan-interval.
    scan-interval: 1m
    # One scan is bounded by batch-size x max-pages-per-scan rows (100 x 10 = 1000 here), taken as keyset pages
    # so a large backlog is drained across several scans instead of in one long transaction.
    batch-size: 100
    max-pages-per-scan: 10
  mail:
    # server-selected sender snapshotted onto each EMAIL notification at acceptance.
    # Resend requires a verified sender/domain; the placeholder is valid only for the fake provider.
    from: ${NOTIFY_MAIL_FROM:notifications@example.com}
  worker:
    email:
      # disabled by default everywhere. Enabling in a shared environment requires the
      # read-only activation preflight (docs/build/B7_EMAIL_DELIVERY_PLAN.md section 13).
      enabled: ${NOTIFY_WORKER_EMAIL_ENABLED:false}
    webhook:
      # extended by disabled by default everywhere, same activation discipline as the email worker.
      enabled: ${NOTIFY_WORKER_WEBHOOK_ENABLED:false}
    inapp:
      # extended by / disabled by default everywhere, same activation discipline.
      enabled: ${NOTIFY_WORKER_INAPP_ENABLED:false}
    datasource:
      # , sizing amended by one bounded worker pool shared by every channel worker
      # (same URL/credentials as spring.datasource.*). Created only when at least one worker is enabled.
      # Primary pool settings are unchanged.
      hikari:
        pool-name: notify-worker
        maximum-pool-size: 14         # 3 listener threads + 1 health poll per enabled worker + 2 headroom (3 channels)
        minimum-idle: 1
        connection-timeout: 3000      # bounds connection acquisition
        validation-timeout: 1000
        initialization-fail-timeout: -1
        data-source-properties:       # delivered to pgjdbc by Hikari
          connectTimeout: 3
          loginTimeout: 3
          socketTimeout: 10           # bounds COMMIT/ROLLBACK/read stalls (statement budget is 5 s)

logging:
  # / structured JSON application logs to stdout (ECS), correlated with traceId/spanId and the
  # tenantId/channel MDC fields. Ships to Loki via Alloy. Bodies and secrets are never logged.
  structured:
    format:
      console: ecs
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %m%n"
  level:
    com.notify: INFO
    org.springframework.web: INFO

