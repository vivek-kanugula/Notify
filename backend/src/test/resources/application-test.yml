notify:
  email:
    provider: fake
  # / -3: retention defaults to enabled in a deployment, so it must be switched off here or its
  # background sweeps would delete other suites' fixture rows mid-test. RetentionJobsIntegrationTest turns
  # it back on for itself.
  retention:
    enabled: false
  outbox:
    relay-enabled: false
    # / -3: one batch per scheduled tick in tests, which is the behaviour the shared-database
    # suites were written against. .1 added a drain loop (default 20 cycles) so a production relay can
    # clear a backlog without waiting out the fixed delay; in the test topology, however, a cached context
    # that enables the relay keeps its scheduler alive for the rest of the JVM run, and a 20-cycle tick
    # drains other suites' PENDING rows fast enough to break their own assertions (observed: two of
    # KafkaDownStartupAndIngressTest's ten rows reaching attempts=2). Production behaviour is unchanged.
    max-drain-cycles: 1
  reconciler:
    enabled: false
  worker:
    email:
      enabled: false
    webhook:
      enabled: false
  webhook:
    # Fixed non-production AES-256 key (base64 of 32 bytes) so webhook tests are deterministic and need no secret
    # from the developer. It protects nothing real: every test database is disposable.
    secret-key: dGVzdC1vbmx5LXdlYmhvb2sta2V5LTMyLWJ5dGVzISE=
  admin:
    default-email: admin@notify.local
    default-password: placeholder_admin_password_min_10_chars
  jwt:
    secret: test_jwt_secret_key_must_be_at_least_32_characters_long_for_hs256
  auth:
    require-gmail: false

# Disable Redis auto-config and Quartz auto-startup in tests
spring:
  quartz:
    auto-startup: false
  kafka:
    bootstrap-servers: ""
    admin:
      auto-create: false
  data:
    redis:
      host: localhost
      port: 16379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
